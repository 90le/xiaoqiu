<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工具 · 小丘</title>
<style>
  :root { --hill:#3E7C59; --dawn:#E8853D; --ink:#22301F; --muted:#7A8471; --line:#E8E1D4; --bg:#F7F3EC; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'MiSans','HarmonyOS Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:16px 14px 30px; }
  h1 { font-size:20px; margin:6px 4px 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 4px 14px; }
  input { width:100%; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:15px; background:#fff; }
  .tool { background:#fff; border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:8px; }
  .tool .n { font-size:13px; font-weight:600; color:var(--hill); }
  .tool .d { font-size:12.5px; color:var(--ink); margin-top:2px; }
  .cnt { color:var(--muted); font-size:12px; margin:10px 4px; }
  .coming { background:#fff; border:1px dashed var(--dawn); border-radius:14px; padding:12px 14px; margin:14px 0 8px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<h1>工具箱</h1>
<div class="sub">小丘的全部手脚</div>
<input id="q" placeholder="搜索工具…" oninput="render()">
<div class="cnt" id="cnt"></div>
<div id="list"></div>
<div class="coming">🖥 终端页 · 🧩 技能市场 · 🎙 语音入口 —— 排期开发中</div>
<script>
let all = [];
async function load() {
  const r = await fetch('/api/tools_list', {method:'POST'});
  const d = (await r.json()).structuredContent;
  all = (d.data || []).map(s => { const i = s.indexOf(' — '); return {n: s.slice(0,i), d: s.slice(i+3)}; });
  render();
}
function render() {
  const q = document.getElementById('q').value.trim();
  const list = all.filter(t => !q || (t.n + t.d).includes(q));
  document.getElementById('cnt').textContent = list.length + ' / ' + all.length + ' 项';
  document.getElementById('list').innerHTML = list.map(t =>
    '<div class="tool"><div class="n">' + t.n + '</div><div class="d">' + t.d + '</div></div>').join('');
}
load();
</script>
</body>
</html>
