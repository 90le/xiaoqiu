<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置 · 小丘</title>
<style>
  :root { --hill:#3E7C59; --dawn:#E8853D; --ink:#22301F; --muted:#7A8471; --line:#E8E1D4; --bg:#F7F3EC; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'MiSans','HarmonyOS Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:20px 16px 40px; }
  h1 { font-size:20px; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  input,select { width:100%; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:15px; background:var(--bg); color:var(--ink); }
  button { width:100%; margin-top:16px; padding:14px; border:0; border-radius:14px; background:var(--hill); color:#fff; font-size:16px; font-weight:600; }
  button:active { opacity:.85; }
  .msg { margin-top:12px; font-size:14px; text-align:center; min-height:18px; }
  .ok { color:var(--hill); } .bad { color:#C24B3C; }
  .kv { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .kv:last-child { border:0; }
  .on { color:var(--hill); font-weight:600; }
  .logo { width:44px; height:44px; }
</style>
</head>
<body>
<svg class="logo" viewBox="0 0 48 48"><circle cx="34" cy="12" r="6" fill="#E8853D"/><path d="M4 38 L18 16 L28 30 L34 22 L44 38 Z" fill="#3E7C59"/></svg>
<h1>小丘设置</h1>
<div class="sub">你说，我来办。</div>

<div class="card">
  <label>API 供应商</label>
  <select id="provider">
    <option value="zai-coding-cn">智谱（zai-coding-cn）</option>
    <option value="zhipu">智谱开放平台</option>
    <option value="custom">自定义</option>
  </select>
  <label>API Key</label>
  <input id="key" type="password" placeholder="粘贴你的 API Key">
  <label>默认模型</label>
  <input id="model" type="text" value="glm-5.3-flash">
  <button onclick="save()">保存</button>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <div style="font-size:14px;font-weight:600;margin-bottom:8px;">环境状态</div>
  <div id="env">加载中…</div>
</div>

<div class="card">
  <div style="font-size:14px;font-weight:600;margin-bottom:8px;">权限中心</div>
  <div id="perm">加载中…</div>
  <button style="background:var(--dawn);margin-top:10px;" onclick="openPerm()">打开缺失项的授权页</button>
  <select id="permtype" style="margin-top:10px;">
    <option value="a11y">无障碍设置页</option>
    <option value="overlay">悬浮窗设置页</option>
    <option value="allfiles">所有文件访问页</option>
  </select>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <div style="font-size:14px;font-weight:600;">🏔 悬浮球</div>
      <div style="font-size:12px;color:var(--muted);">保活可见 + 单击快速回到小丘</div>
    </div>
    <button style="width:auto;margin:0;padding:10px 18px;" onclick="toggleBall(this)">切换</button>
  </div>
</div>

<div class="card">
  <div class="kv"><span>版本</span><span>0.9.0</span></div>
  <div class="kv"><span>引擎</span><span>pi coding-agent</span></div>
  <div class="kv"><span>MCP</span><span>127.0.0.1:8181</span></div>
</div>

<script>
async function loadEnv() {
  try {
    const r = await fetch('/api/env_status', {method:'POST'});
    const d = (await r.json()).structuredContent.data;
    document.getElementById('env').innerHTML =
      '<div class="kv"><span>pi 环境</span><span class="' + (d.ready?'on':'') + '">' + (d.ready?'✅ 就绪':'未就绪') + '</span></div>' +
      '<div class="kv"><span>node</span><span class="' + (d.node?'on':'') + '">' + (d.node?'✅':'—') + '</span></div>' +
      '<div class="kv"><span>安装中</span><span>' + (d.running?'是':'否') + '</span></div>';
  } catch(e) { document.getElementById('env').textContent = '读取失败'; }
}
async function save() {
  const m = document.getElementById('msg');
  m.className = 'msg'; m.textContent = '保存中…';
  try {
    const r = await fetch('/api/setkey', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({provider:document.getElementById('provider').value,
        key:document.getElementById('key').value,
        model:document.getElementById('model').value})});
    const d = (await r.json()).structuredContent;
    m.className = 'msg ' + (d.ok ? 'ok' : 'bad');
    m.textContent = d.ok ? d.data : (d.error ? d.error.message : '失败');
  } catch(e) { m.className='msg bad'; m.textContent='网络错误'; }
}
loadEnv(); loadPerm();

let missingPerm = null;
async function loadPerm() {
  try {
    const r = await fetch('/api/perm_status', {method:'POST'});
    const d = (await r.json()).structuredContent.data;
    const row = (k, label, ok) => '<div class="kv"><span>' + label + '</span><span class="' + (ok?'on':'') + '">' + (ok?'✅':'❌') + '</span></div>';
    document.getElementById('perm').innerHTML =
      row('a', '无障碍', d.accessibility) + row('o', '悬浮窗', d.overlay) +
      row('f', '所有文件', d.allFiles) + row('q', '队列桥', d.queueBridge) +
      row('e', 'pi 环境', d.envReady) + row('w', '对话服务', d.webui);
    missingPerm = !d.accessibility ? 'a11y' : (!d.overlay ? 'overlay' : (!d.allFiles ? 'allfiles' : null));
  } catch(e) { document.getElementById('perm').textContent = '读取失败'; }
}
async function openPerm() {
  const t = missingPerm || document.getElementById('permtype').value;
  await fetch('/api/open_permission_settings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type:t})});
}
async function toggleBall(btn) {
  btn.textContent = '…';
  const r = await fetch('/api/floatball', {method:'POST'});
  await new Promise(res => setTimeout(res, 600));
  btn.textContent = '切换';
  loadPerm();
}
loadPerm();

</script>
</body>
</html>
