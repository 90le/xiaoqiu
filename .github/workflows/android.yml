name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Set up Go (for rclone.aar)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build rclone.aar (backup feature)
        working-directory: deps
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./build_rclone_android.sh
          mkdir -p ../src/android/app/libs
          cp build/rclone/rclone.aar ../src/android/app/libs/rclone.aar

      - name: Build PRoot (sandbox core)
        working-directory: deps
        run: |
          ./build_proot.sh

      - name: Provider customization template
        working-directory: src/android/app
        run: |
          cp provider-customization.properties.example provider-customization.properties

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoqiu-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
